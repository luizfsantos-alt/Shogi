<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Shogi</title>
    <!--
      On hosts that cannot send COOP/COEP headers (GitHub Pages), this service worker adds them,
      so the threaded AI engine can run. It does nothing where the page is already isolated.
      All our files are same-origin, so "require-corp" works in every browser (Safari included).
    -->
    <script>
      window.coi = { coepCredentialless: () => false, quiet: true };
    </script>
    <script src="coi-serviceworker.js"></script>
  </head>
  <body>
    <div id="app"><p class="loading">Carregando o Shogi…</p></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
